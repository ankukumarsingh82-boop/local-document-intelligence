[project]
name = "local-document-intelligence"
version = "0.1.0"
description = "Ask questions about local documents. The model runs on this Mac."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mlx-lm>=0.32.2",
  "openpyxl>=3.1.5",
  "pypdf>=5.1.0",
  "pypdfium2>=5.15.1",
  "python-docx>=1.1.2",
]

[project.scripts]
ldi = "ldi.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ldi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
